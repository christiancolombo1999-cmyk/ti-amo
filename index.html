<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#09030b">
<title>Per te ❤️</title>
<style>
:root{--pink:#ff5b9a;--soft:#ffd9e8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09030b}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#fff}
#bg{position:fixed;inset:0;background:
radial-gradient(circle at 50% 38%,rgba(142,24,78,.38),transparent 35%),
radial-gradient(circle at 15% 85%,rgba(255,74,145,.12),transparent 30%),
linear-gradient(145deg,#160713,#080309 65%,#12040d)}
canvas{position:fixed;inset:0;z-index:1}
.page{position:relative;z-index:4;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px}
.card{width:min(92vw,560px);transition:1s cubic-bezier(.2,.8,.2,1)}
.kicker{font-size:13px;letter-spacing:4px;text-transform:uppercase;color:#ffc7dc;opacity:.9}
h1{font-weight:300;font-size:clamp(34px,10vw,62px);line-height:1.08;margin:22px 0 0;text-shadow:0 0 35px rgba(255,74,145,.3)}
p{font-size:18px;line-height:1.5;color:#ffe6ef;margin:24px 0}
.btn{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:white;border-radius:100px;padding:16px 30px;font-size:17px;box-shadow:0 0 35px rgba(255,70,140,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.btn:active{transform:scale(.95)}
#final{display:none}
.bigHeart{font-size:clamp(75px,24vw,150px);line-height:1;animation:beat 1.15s infinite;filter:drop-shadow(0 0 24px rgba(255,50,130,.7));}
.love{font-weight:800;font-size:clamp(66px,20vw,135px);line-height:.9;margin-top:12px;letter-spacing:-5px;background:linear-gradient(120deg,#fff,#ffc1da 35%,#ff4b91 65%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 25px rgba(255,70,145,.45));animation:shine 2.5s infinite}
.sub{font-size:20px;margin-top:25px}
.signature{font-size:14px;letter-spacing:2px;color:#ffc8dc;margin-top:28px}
#mute{position:fixed;right:18px;top:calc(env(safe-area-inset-top) + 16px);z-index:8;width:40px;height:40px;border-radius:50%;border:1px solid #ffffff30;background:#ffffff12;color:white;display:none}
.hidden{opacity:0;transform:scale(.88);pointer-events:none}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.15)}28%{transform:scale(1)}43%{transform:scale(1.08)}}
@keyframes shine{0%,100%{filter:drop-shadow(0 0 18px rgba(255,70,145,.3))}50%{filter:drop-shadow(0 0 45px rgba(255,70,145,.9))}}
.spark{position:fixed;z-index:3;pointer-events:none;font-size:18px}
</style>
</head>
<body>
<div id="bg"></div><canvas id="c"></canvas>

<div class="page">
  <section class="card" id="intro">
    <div class="kicker">una piccola sorpresa ✨</div>
    <h1>Prima di continuare…<br>fammi un piccolo favore.</h1>
    <p>Metti il volume. ❤️<br>E promettimi che arrivi fino alla fine.</p>
    <button class="btn" id="start">Promesso ❤️</button>
  </section>

  <section class="card" id="final">
    <div class="bigHeart">♥</div>
    <div class="love">TI AMO</div>
    <div class="sub">e non c'era bisogno di un'occasione<br>per ricordartelo. 🥹❤️</div>
    <div class="signature">semplicemente… tu sei tu. ✨</div>
  </section>
</div>
<button id="mute">🔊</button>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,dpr,stars=[],petals=[],running=true;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',size);size();
for(let i=0;i<95;i++)stars.push({x:Math.random(),y:Math.random(),r:.5+Math.random()*1.8,a:Math.random()*6.28,s:.003+Math.random()*.01});
function loop(){
 ctx.clearRect(0,0,W,H);
 stars.forEach(q=>{q.a+=q.s;ctx.globalAlpha=.18+.35*(Math.sin(q.a)+1)/2;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(q.x*W,q.y*H,q.r,0,7);ctx.fill()});
 ctx.globalAlpha=1;requestAnimationFrame(loop)
}loop();

function heart(){
 const e=document.createElement('div');e.className='spark';
 e.textContent=['♥','♡','✦','✧','💕'][Math.floor(Math.random()*5)];
 e.style.left=(Math.random()*100)+'vw';e.style.top=(105+Math.random()*8)+'vh';
 e.style.color=['#ff5b9a','#ffb6d1','#fff','#ff79ad'][Math.floor(Math.random()*4)];
 e.style.textShadow='0 0 18px currentColor';
 document.body.appendChild(e);
 const x=(Math.random()-.5)*110, dur=3600+Math.random()*3600;
 e.animate([{transform:'translate3d(0,0,0) rotate(0)',opacity:0},
 {transform:`translate3d(${x}px,-35vh,0) rotate(90deg)`,opacity:1,offset:.22},
 {transform:`translate3d(${-x/2}px,-120vh,0) rotate(220deg)`,opacity:0}],{duration:dur,easing:'cubic-bezier(.2,.7,.2,1)'});
 setTimeout(()=>e.remove(),dur);
}

// Tiny romantic ambient music made with Web Audio, starts only after a user tap.
let audioCtx,master,timer,musicOn=false;
const notes=[261.63,329.63,392,523.25,392,329.63,293.66,349.23,440,587.33,440,349.23];
function music(){
 if(musicOn)return; musicOn=true;
 audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 master=audioCtx.createGain();master.gain.value=.045;master.connect(audioCtx.destination);
 let i=0;
 timer=setInterval(()=>{
   const now=audioCtx.currentTime,n=notes[i++%notes.length];
   const o=audioCtx.createOscillator(),g=audioCtx.createGain();
   o.type='sine';o.frequency.value=n;g.gain.setValueAtTime(0,now);
   g.gain.linearRampToValueAtTime(.18,now+.12);g.gain.exponentialRampToValueAtTime(.001,now+1.8);
   o.connect(g);g.connect(master);o.start(now);o.stop(now+1.9);
 },620);
}
function burst(){
 for(let i=0;i<70;i++)setTimeout(heart,i*22);
}
document.getElementById('start').addEventListener('click',()=>{
 music();
 document.getElementById('mute').style.display='block';
 const a=document.getElementById('intro');a.classList.add('hidden');
 setTimeout(()=>{
   a.style.display='none';
   const f=document.getElementById('final');f.style.display='block';
   requestAnimationFrame(()=>f.classList.remove('hidden'));
   burst();setInterval(heart,130);
 },850);
});
document.getElementById('mute').addEventListener('click',()=>{
 if(!audioCtx)return;
 if(audioCtx.state==='running'){audioCtx.suspend();document.getElementById('mute').textContent='🔇'}
 else{audioCtx.resume();document.getElementById('mute').textContent='🔊'}
});
</script>
</body>
</html>
